<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Results - BookWorm Haven</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .back-btn {
      display: inline-block;
      background: linear-gradient(90deg, #fa709a 0%, #ffe08a 100%);
      color: #232323;
      font-family: inherit;
      font-size: 1.12rem;
      border-radius: 24px;
      margin: 1em 2em;
      padding: 0.7rem 2rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 2px 2px 0 #fa709a33;
      transition: background 0.18s;
      border: none;
    }
    .back-btn:hover { background: linear-gradient(90deg, #ffe08a 0%, #fa709a 100%); }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 2rem 1rem 2rem;
    }
    .results-title {
      font-size: 2rem;
      color: #232323;
      font-weight: 700;
      text-shadow: 2px 2px 0 #fff691;
    }
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
      gap: 1.25rem;
      max-width: 1400px;
      margin: 0 auto 2rem auto;
      padding: 0 2rem;
    }
    .load-more-btn {
      display: block;
      margin: 0 auto 2rem auto;
      background: linear-gradient(90deg, #5bc0eb 0%, #fa709a 100%);
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 22px;
      padding: 0.7rem 2.2rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 #23232351;
      transition: background 0.18s;
    }
    .load-more-btn:hover {
      background: linear-gradient(90deg, #fa709a 0%, #5bc0eb 100%);
    }
  </style>
</head>
<body>
  <a class="back-btn" href="index.html">← Back</a>
  <header class="results-header">
    <span class="results-title">BookWorm Haven: Search results</span>
    <form id="searchForm" class="search-form" autocomplete="off" action="results.html" method="GET">
      <input
        type="text"
        id="searchInput"
        name="q"
        class="comic-input search-input"
        placeholder="Search books, authors, ISBN…"
        required
      />
      <button type="submit" class="comic-btn search-btn">Search</button>
    </form>
  </header>

  <main>
    <div id="results">Loading...</div>
    <button id="loadMoreBtn" class="load-more-btn" style="display:none;">Load More</button>
  </main>

  <script src="main.js"></script>
</body>
</html>
